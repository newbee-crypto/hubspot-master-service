version: "3.9"

services:
  # ── HubSpot Master Service ──────────────────────────────────────────
  app:
    build: .
    container_name: hubspot-master-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://hubspot_user:hubspot_pass@postgres:5432/hubspot_service
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - app-data:/app/data
    restart: unless-stopped

  # ── PostgreSQL ──────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: hubspot-postgres
    environment:
      POSTGRES_USER: hubspot_user
      POSTGRES_PASSWORD: hubspot_pass
      POSTGRES_DB: hubspot_service
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hubspot_user -d hubspot_service"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── MinIO (S3-compatible object storage) ────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: hubspot-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"    # API
      - "9001:9001"    # Console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  minio-data:
  app-data:
